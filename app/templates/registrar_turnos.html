{% extends "base.html" %} {% block content %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registro</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename= 'css/registrosF.css')}}"
    />
  </head>
  <body>
    <h1 class="titulos">REGISTRO</h1>
    <br />

    <div class="cajainput">
      <form onsubmit="guardardatos(); return false;">
        <h3>Por favor, complete los siguientes campos:</h3>
        <br />

        <h3>DATOS</h3>

        <label>Nombre y Apellido</label><br /><br />
        <input type="text" id="nombreinput" required /><br /><br />

        <label>Numero de telefono</label><br /><br />
        <input
          type="number"
          required
          minlength="10"
          maxlength="10"
        /><br /><br />

        <label>Correo electronico</label><br /><br />
        <input type="email" required /><br /><br />

        <p>EL PAGO SE REALIZARA EN EFECTIVO</p>

        <br /><br />

        <button type="submit">REGISTRAR</button>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const fila = params.get("fila");

      function guardardatos() {
        localStorage.setItem(
          "nombrereserva" + fila,
          document.getElementById("nombreinput").value
        );

        localStorage.setItem("estadoreserva" + fila, "No Disponible");

        window.location.href = "{{url_for('turnos_disponibles')}}";
      }
    </script>
  </body>
</html>

{% endblock %}
