{% extends "base.html" %} {% block title %}Reservas - El Tercer Tiempo{%
endblock %} {% block content %}

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tabla</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename= 'css/turnos.css')}}"
    />
  </head>
  <body>
    <div class="flechacontenedor">
      <a class="Centerstyle" href="{{url_for('eleccion_deporte')}}"
        ><img
          class="flecha"
          src="{{ url_for('static', filename= 'img/flecha.png')}}"
          alt="logo"
      /></a>
    </div>

    <div class="contenedor">
      <div class="tablaestilo">
        <h3 class="titulos">PADLE</h3>
        <table>
          <tr>
            <td>Nombre</td>
            <td>Estado</td>
            <td>Hora</td>
          </tr>
          <tr>
            <th id="2nombre1"></th>
            <th id="2estado1"></th>
            <th>18:00</th>
            <th id="2reservar1">
              <a
                class="reservarboton"
                href="{{ url_for('registrar_padle', fila=1) }}"
                >RESERVAR</a
              >
            </th>
            <th id="2cancelar1">
              <a class="cancelarboton" onclick="borrarFila(1)"> CANCELAR </a>
            </th>
          </tr>
          <tr>
            <th id="2nombre2"></th>
            <th id="2estado2"></th>
            <th>19:00</th>
            <th id="2reservar2">
              <a
                class="reservarboton"
                href="{{ url_for('registrar_padle', fila=2) }}"
                >RESERVAR</a
              >
            </th>
            <th id="2cancelar2">
              <a class="cancelarboton" onclick="borrarFila(2)"> CANCELAR </a>
            </th>
          </tr>

          <tr>
            <th id="2nombre3"></th>
            <th id="2estado3"></th>
            <th>20:00</th>
            <th id="2reservar3">
              <a
                class="reservarboton"
                href="{{ url_for('registrar_padle', fila=3) }}"
                >RESERVAR</a
              >
            </th>
            <th id="2cancelar3">
              <a class="cancelarboton" onclick="borrarFila(3)"> CANCELAR </a>
            </th>
          </tr>

          <tr>
            <th id="2nombre4"></th>
            <th id="2estado4"></th>
            <th>21:00</th>
            <th id="2reservar4">
              <a
                class="reservarboton"
                href="{{ url_for('registrar_padle', fila=4) }}"
                >RESERVAR</a
              >
            </th>
            <th id="2cancelar4">
              <a class="cancelarboton" onclick="borrarFila(4)"> CANCELAR </a>
            </th>
          </tr>

          <tr>
            <th id="2nombre5"></th>
            <th id="2estado5"></th>
            <th>22:00</th>
            <th id="2reservar5">
              <a
                class="reservarboton"
                href="{{ url_for('registrar_padle', fila=5) }}"
                >RESERVAR</a
              >
            </th>
            <th id="2cancelar5">
              <a class="cancelarboton" onclick="borrarFila(5)"> CANCELAR </a>
            </th>
          </tr>
        </table>
      </div>
    </div>

    <button class="boton" type="button" onclick="borrardatos()">
      Limpiar tabla
    </button>

    <script>
      for (let i = 1; i <= 5; i++) {
        document.getElementById("2nombre" + i).textContent =
          localStorage.getItem("2nombrereserva" + i) || "";
        document.getElementById("2estado" + i).textContent =
          localStorage.getItem("2estadoreserva" + i) || "disponible";

        let estadoreserva = localStorage.getItem("2estadoreserva" + i);

        if (estadoreserva === "No Disponible") {
          document.getElementById("2reservar" + i).classList.add("ocultar");
        } else {
          document.getElementById("2cancelar" + i).classList.add("ocultar");
        }
      }
    </script>

    <script>
      function borrarFila(fila) {
        localStorage.removeItem("2nombrereserva" + fila);
        localStorage.removeItem("2estadoreserva" + fila);

        location.reload();
      }
    </script>

    <script>
      function borrardatos() {
        localStorage.clear();

        window.location.href = "{{url_for('turnos_padle')}}";
      }
    </script>
  </body>
</html>

{% endblock %}
